<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signup - Asin Biju</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Signup</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="gallery.html">Gallery</a>
      <a href="signup.html">Signup</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>
  <main>
    <h2>Signup Form</h2>
    <form>
      <label>First Name: <input type="text" name="fname" required></label><br>
      <label>Last Name: <input type="text" name="lname" required></label><br>
      <label>Email: <input type="email" name="email" required></label><br>
      <label>Password: <input type="password" name="password" required></label><br>
      <label>Confirm Password: <input type="password" name="cpassword" required></label><br>
      <label>Phone: <input type="tel" name="phone"></label><br>
      <label>Date of Birth: <input type="date" name="dob"></label><br>
      <label>Gender: <select name="gender">
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select></label><br>
      <label>Address: <textarea name="address"></textarea></label><br>
      <label>City: <input type="text" name="city"></label><br>
      <label>State: <input type="text" name="state"></label><br>
      <label>Country: <input type="text" name="country"></label><br>
      <label>ZIP Code: <input type="text" name="zip"></label><br>
      <label>LinkedIn: <input type="url" name="linkedin"></label><br>
      <label>GitHub: <input type="url" name="github"></label><br>
      <button type="submit">Submit</button>
    </form>
  </main>
</body>
</html>
